# Общий фильтр миров (пусто = все миры)
worlds: []

# Уровень мобов MythicMobs при спавне
level: 1

# Логировать действия в консоль
debug: false

# ===== Фоновый спавнер =====
# Держит заданное число мобов из списка в радиусе вокруг КАЖДОГО игрока.
# Подсыпает постепенно (max-spawn-per-cycle за цикл), не ближе min-distance к игроку.
ambient-spawner:
  enabled: true
  radius-chunks: 4         # радиус вокруг игрока (в чанках). 4 = 64 блока
  count: 20                # сколько мобов держать в радиусе
  min-distance: 12         # не спавнить ближе этого к игроку (блоки)
  # Максимальный уровень света в точке спавна (0-15). 2 = спавн только в темноте: не на солнце, не у факелов/фонарей/ламп.
  max-light: 2
  spawn-clearance: 1       # радиус свободного места вокруг точки спавна (1 = площадка 3x3, 2 блока в высоту). Для широких мобов (пауки)
  # Вода: точки в воде, под водой и в залитых водой блоках никогда не используются (встроено, не настраивается)
  tick-interval: 20        # как часто работает цикл (тики). 20 = раз в секунду
  max-spawn-per-cycle: 5   # максимум спавнов за один цикл (чтобы не было лагов)
  despawn-after: 200       # через сколько тиков удалить моба, если рядом нет игрока
  # Типы миров, где работает спавнер: NORMAL (обычный мир), NETHER, THE_END. По умолчанию только NORMAL.
  environments:
    - NORMAL
  mobs:                    # пул мобов MythicMobs (выбор случайный)
    - cprowler_em
    - ElectricCreeper
    - FlashCreeper
    - IlussionCreeper
    - new_creeper
    - SporeCreeper
    - UmberCreeper

  # Правила по мобам: где именно может появиться моб из списка mobs. Моб без правила спавнится везде.
  # Все указанные условия должны выполняться одновременно.
  #   underground: true  — только там, где нет неба над головой (пещеры, данжи); false — только под открытым небом
  #   min-y / max-y      — диапазон высот
  #   worlds             — список миров
  #   biomes             — список биомов (ключи Minecraft: DEEP_DARK, LUSH_CAVES, DRIPSTONE_CAVES, ...)
  mob-rules:
    spider_melee:
      underground: true
    spider_poison:
      underground: true
      max-y: 60

# ===== Замена ванильного моба в момент спавна =====
# Ванильный триггер остаётся родным, подменяется только сущность в той же точке.
# Пример: Варден появляется ровно как в ванилле (4 активации крикуна в Deep Dark, 20 попыток
# размещения, выход из земли инициирует игра), но вместо него встаёт mega_warden.
# Срабатывает на любой спавн, кроме CUSTOM (спавны плагинов) и яиц призыва (их см. ниже).
replace-vanilla:
  WARDEN:
    - mega_warden

# ===== Подавление ванильного спавна =====
# Эти ванильные мобы НЕ будут спавниться в мире (natural/спавнеры),
# чтобы мир не переполнялся вместе с фоновым спавнером.
# Пусто = ничего не трогаем. Яйца призыва этим не затрагиваются.
suppress-vanilla:
  - ZOMBIE
  - CREEPER

# ===== Запрет ванильного спавна только в указанных измерениях =====
# Тип моба -> список измерений, где его natural/spawner-спавн отменяется: NORMAL, NETHER, THE_END.
# Пример ниже: эндермены не появляются в обычном мире, но остаются в Незере и Энде.
suppress-vanilla-in-environments:
  ENDERMAN:
    - NORMAL

# ===== Яйца призыва: 1 яйцо = 1 спавн (рандом из списка) =====
# Ключ — тип ванильного яйца (EntityType). В выживании/приключении тратится 1 яйцо,
# в креативе — нет. Эти мобы НЕ учитываются фоновым спавнером и не деспавнятся по таймеру.
egg-replacements:
  ZOMBIE:
    - cprowler_em
  CREEPER:
    - ElectricCreeper
    - FlashCreeper
    - IlussionCreeper
    - new_creeper
    - SporeCreeper
    - UmberCreeper
  WARDEN:
    - mega_warden
