  bad-version: '{prefix}<red>Версия: 1.8 или 1.9.'
  bad-difficulty: '{prefix}<red>Сложности: <white>{list}'
  mode-disabled: '{prefix}<red>Этот режим сейчас выключен.'
  no-arena: '{prefix}<red>Нет готовых арен для режима <white>{mode}</white>.'
  arena-unavailable: '{prefix}<red>Арена <white>{arena}</white> не подходит для этого режима.'
  starting: '{prefix}<gray>{mode} · PvP <white>{version}</white> · {difficulty} <gray>· {arena}'
  duel:
    win:
      title: '<green><b>ПОБЕДА</b>'
      subtitle: '<gray>бот {difficulty} <gray>повержен'
      stay: 2500
    loss:
      title: '<red><b>ПОРАЖЕНИЕ</b>'
      subtitle: '<gray>у бота осталось <red>{bot_hp}❤'
      stay: 2500
    draw:
      title: '<yellow><b>НИЧЬЯ</b>'
      subtitle: '<gray>время вышло'
      stay: 2500
    summary:
      - '<dark_gray>───────────────────────'
      - ' <gradient:#ff9ecf:#c9a7ff><b>Дуэль с ботом</b></gradient> <gray>· PvP {version} · {difficulty}'
      - ' <gray>Удары: <green>{hits}</green> <dark_gray>/</dark_gray> <red>{bot_hits}</red> <gray>· лучшее комбо <yellow>{best_combo}'
      - ' <gray>Твоё ❤: <red>{player_hp}</red> <gray>· бот ❤: <red>{bot_hp}</red> <gray>· время <white>{time}'
      - '<dark_gray>───────────────────────'
  clicktest:
    fell: '<red>Ты упал! <gray>Возвращаю на точку.'
    knockoff: '<green>Бот скинут! <gray>Всего: <white>{knockoffs}'
    finished:
      title: '<gradient:#ff9ecf:#c9a7ff><b>{score}</b></gradient>'
      subtitle: '<gray>кликов за {time} · макс <white>{max_cps}</white> CPS'
      stay: 3000
    summary:
      - '<dark_gray>───────────────────────'
      - ' <gradient:#ff9ecf:#c9a7ff><b>Клик-тест</b></gradient> <gray>· PvP {version} · {difficulty}'
      - ' <gray>Клики: <white>{clicks}</white> <gray>· удары: <white>{hits}</white> <gray>· точность <white>{accuracy}%'
      - ' <gray>CPS: средний <white>{avg_cps}</white> <gray>· максимум <white>{max_cps}'
      - ' <gray>Скинул бота: <green>{knockoffs}</green> <gray>· упал сам: <red>{falls}'
      - '<dark_gray>───────────────────────'
    new-best: '{prefix}<gold>Новый рекорд: <white>{score}</white> <gray>(было {previous})'
  stats:
    header: '{prefix}<gray>Статистика <white>{player}</white>:'
    line: ' <dark_gray>•</dark_gray> {difficulty}<gray>: <green>{wins}</green> побед, <red>{losses}</red> поражений'
    clicktest: ' <dark_gray>•</dark_gray> <gray>Клик-тест: рекорд <white>{best}</white>, макс <white>{cps}</white> CPS'
  top:
    header: '{prefix}<gray>Топ клик-теста:'
    empty: ' <gray>Пока пусто — будь первым: /bot clicktest'
    line: ' <white>{place}.</white> <gray>{player}</gray> <dark_gray>—</dark_gray> <white>{score}</white> <gray>({cps} CPS)'

