# Тексты Miharu. Формат — MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# Также работают &-коды: &#54DAF4 (HEX), &a…&f, &l жирный, &o курсив, &n подчёркнутый, &m зачёркнутый, &r сброс.
# Градиент по буквам: &#54DAF4B&#54C8EBi&#54B7E2r … Новый цвет сбрасывает &l, как в обычных кодах.
# Это касается всех текстов плагина: меню, предметы, табло, таб, названия китов.
# {ключ} — подстановки. Пустая строка = сообщение не отправляется.
prefix: '<gradient:#ff9ecf:#c9a7ff><b>Miharu</b></gradient> <dark_gray>»</dark_gray> '

no-permission: '{prefix}<red>Недостаточно прав.'
players-only: '{prefix}<red>Только для игроков.'
player-not-found: '{prefix}<red>Игрок <white>{player}</white> не найден.'
bad-number: '{prefix}<red>Ожидалось число.'

admin:
  help:
    - '<gradient:#ff9ecf:#c9a7ff><b>Miharu</b></gradient> <gray>v{version} · tearsmilk'
    - '<white>/miharu reload</white> <gray>— перечитать все конфиги'
    - '<white>/miharu modules</white> <gray>— состояние модулей'
    - '<white>/miharu games</white> <gray>— идущие игры'
    - '<white>/force-start [режим]</white> <gray>— митап: запустить с теми, кто в очереди, или пропустить подготовку (OP)'
    - '<white>/miharu adm-items</white> <gray>— все предметы из всех китов, просмотр (только OP)'
    - '<white>/miharu adm-mode</white> <gray>— режим строителя (только OP): свой инвентарь, креатив, без защит лобби'
    - '<white>/miharu start <игрок> <duel|clicktest> <1.8|1.9> <сложность> [арена]</white> <gray>— запустить игру'
    - '<white>/miharu stop <id|игрок|all></white> <gray>— остановить игру'
    - '<white>/arena</white> <gray>— настройка арен · <white>/bot</white> <gray>— игры с ботами · <white>/pvp</white> <gray>— версия боя'
  reloaded: '{prefix}<green>Конфиги перезагружены.'
  module-line: '{prefix}<white>{module}</white> <dark_gray>—</dark_gray> {state}'
  items-title: '<dark_gray>Предметы китов <gray>· {page}/{pages}'
  items-kits: '<gray>В китах ({count}):'
  items-prev: '<yellow>← Назад'
  items-next: '<yellow>Дальше →'
  items-info: '<white>Всего предметов: {count} <gray>· стр. {page}/{pages}'
  no-games: '{prefix}<gray>Сейчас игр нет.'
  game-line: '{prefix}<white>#{id}</white> <gray>{mode} · {arena} · {state} ·</gray> <white>{players}'
  usage-start: '{prefix}<red>/miharu start <игрок> <duel|clicktest> <1.8|1.9> <сложность> [арена]'
  usage-stop: '{prefix}<red>/miharu stop <id|игрок|all>'
  started: '{prefix}<green>Игра для <white>{player}</white> запускается.'
  stopped: '{prefix}<green>Остановлено игр: <white>{count}'
  game-not-found: '{prefix}<red>Игра <white>{game}</white> не найдена.'

pvp:
  current: '{prefix}<gray>Твоя версия боя: <white>{version}'
  set: '{prefix}<green>{player}: версия боя <white>{version}'
  reset: '{prefix}<green>{player}: версия боя сброшена (мир / по умолчанию).'
  usage: '{prefix}<red>/pvp <1.8|1.9|off> [игрок]'

arena:
  help:
    - '<gradient:#ff9ecf:#c9a7ff><b>Арены</b></gradient>'
