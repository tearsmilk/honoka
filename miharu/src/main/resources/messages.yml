  arena-unavailable: '{prefix}<red>Арена <white>{arena}</white> не подходит для этого режима.'
  starting: '{prefix}<gray>{mode} · PvP <white>{version}</white> · {difficulty} <gray>· {arena}'
  duel:
    win:
      title: '<green><b>ПОБЕДА</b>'
      subtitle: '<gray>бот {difficulty} <gray>повержен'
      stay: 2500
    loss:
      title: '<red><b>ПОРАЖЕНИЕ</b>'
      subtitle: '<gray>у бота осталось <red>{bot_hp}❤'
      stay: 2500
    draw:
      title: '<yellow><b>НИЧЬЯ</b>'
      subtitle: '<gray>время вышло'
      stay: 2500
    summary:
      - '<dark_gray>───────────────────────'
      - ' <gradient:#ff9ecf:#c9a7ff><b>Дуэль с ботом</b></gradient> <gray>· PvP {version} · {difficulty}'
      - ' <gray>Удары: <green>{hits}</green> <dark_gray>/</dark_gray> <red>{bot_hits}</red> <gray>· лучшее комбо <yellow>{best_combo}'
      - ' <gray>Твоё ❤: <red>{player_hp}</red> <gray>· бот ❤: <red>{bot_hp}</red> <gray>· время <white>{time}'
      - '<dark_gray>───────────────────────'
  clicktest:
    fell: '<red>Ты упал! <gray>Возвращаю на точку.'
    knockoff: '<green>Бот скинут! <gray>Всего: <white>{knockoffs}'
