      subtitle: '<gray>кликов за {time} · макс <white>{max_cps}</white> CPS'
      stay: 3000
    summary:
      - '<dark_gray>───────────────────────'
      - ' <gradient:#ff9ecf:#c9a7ff><b>Клик-тест</b></gradient> <gray>· PvP {version} · {difficulty}'
      - ' <gray>Клики: <white>{clicks}</white> <gray>· удары: <white>{hits}</white> <gray>· точность <white>{accuracy}%'
      - ' <gray>CPS: средний <white>{avg_cps}</white> <gray>· максимум <white>{max_cps}'
      - ' <gray>Скинул бота: <green>{knockoffs}</green> <gray>· упал сам: <red>{falls}'
      - '<dark_gray>───────────────────────'
