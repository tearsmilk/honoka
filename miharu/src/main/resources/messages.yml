# Тексты Miharu. Формат — MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# Также работают &-коды: &#54DAF4 (HEX), &a…&f, &l жирный, &o курсив, &n подчёркнутый, &m зачёркнутый, &r сброс.
# Градиент по буквам: &#54DAF4B&#54C8EBi&#54B7E2r … Новый цвет сбрасывает &l, как в обычных кодах.
# Это касается всех текстов плагина: меню, предметы, табло, таб, названия китов.
# {ключ} — подстановки. Пустая строка = сообщение не отправляется.
prefix: '<gradient:#ff9ecf:#c9a7ff><b>Miharu</b></gradient> <dark_gray>»</dark_gray> '

no-permission: '{prefix}<red>Недостаточно прав.'
players-only: '{prefix}<red>Только для игроков.'
player-not-found: '{prefix}<red>Игрок <white>{player}</white> не найден.'
bad-number: '{prefix}<red>Ожидалось число.'

admin:
  help:
    - '<gradient:#ff9ecf:#c9a7ff><b>Miharu</b></gradient> <gray>v{version} · tearsmilk'
    - '<white>/miharu reload</white> <gray>— перечитать все конфиги'
    - '<white>/miharu modules</white> <gray>— состояние модулей'
    - '<white>/miharu games</white> <gray>— идущие игры'
    - '<white>/miharu adm-items</white> <gray>— все предметы из всех китов, просмотр (только OP)'
    - '<white>/miharu adm-mode</white> <gray>— режим строителя (только OP): свой инвентарь, креатив, без защит лобби'
    - '<white>/miharu start <игрок> <duel|clicktest> <1.8|1.9> <сложность> [арена]</white> <gray>— запустить игру'
    - '<white>/miharu stop <id|игрок|all></white> <gray>— остановить игру'
    - '<white>/arena</white> <gray>— настройка арен · <white>/bot</white> <gray>— игры с ботами · <white>/pvp</white> <gray>— версия боя'
  reloaded: '{prefix}<green>Конфиги перезагружены.'
  module-line: '{prefix}<white>{module}</white> <dark_gray>—</dark_gray> {state}'
  items-title: '<dark_gray>Предметы китов <gray>· {page}/{pages}'
  items-kits: '<gray>В китах ({count}):'
  items-prev: '<yellow>← Назад'
  items-next: '<yellow>Дальше →'
  items-info: '<white>Всего предметов: {count} <gray>· стр. {page}/{pages}'
  no-games: '{prefix}<gray>Сейчас игр нет.'
  game-line: '{prefix}<white>#{id}</white> <gray>{mode} · {arena} · {state} ·</gray> <white>{players}'
  usage-start: '{prefix}<red>/miharu start <игрок> <duel|clicktest> <1.8|1.9> <сложность> [арена]'
  usage-stop: '{prefix}<red>/miharu stop <id|игрок|all>'
  started: '{prefix}<green>Игра для <white>{player}</white> запускается.'
  stopped: '{prefix}<green>Остановлено игр: <white>{count}'
  game-not-found: '{prefix}<red>Игра <white>{game}</white> не найдена.'

pvp:
  current: '{prefix}<gray>Твоя версия боя: <white>{version}'
  set: '{prefix}<green>{player}: версия боя <white>{version}'
  reset: '{prefix}<green>{player}: версия боя сброшена (мир / по умолчанию).'
  usage: '{prefix}<red>/pvp <1.8|1.9|off> [игрок]'

arena:
  help:
    - '<gradient:#ff9ecf:#c9a7ff><b>Арены</b></gradient>'
    - '<white>/arena create <id></white> <gray>— новая арена (строишь в любом мире)'
    - '<white>/arena pos1</white>, <white>/arena pos2</white> <gray>[x y z] — углы области (по умолчанию — где стоишь)'
    - '<white>/arena spawn <точка></white> <gray>— точка спавна: player, bot, p1, p2...'
    - '<white>/arena void [y]</white> <gray>— высота пустоты (ниже — падение)'
    - '<white>/arena mode <режим></white> <gray>— включить/выключить режим (bot-duel, clicktest)'
    - '<white>/arena display <текст></white>, <white>/arena icon [материал]</white>'
    - '<white>/arena info [id]</white> <gray>— что уже настроено'
    - '<white>/arena save</white> <gray>— сохранить схематику и арену'
    - '<white>/arena edit <id></white> <gray>— открыть арену в отдельном мире и поправить'
    - '<white>/arena cancel</white>, <white>/arena list</white>, <white>/arena delete <id></white>, <white>/arena enable|disable <id></white>'
  no-setup: '{prefix}<red>Сначала /arena create <id> или /arena edit <id>.'
  usage-create: '{prefix}<red>/arena create <id> <gray>(латиница, цифры, _ и -)'
  usage-spawn: '{prefix}<red>/arena spawn <точка> <gray>(например player или bot)'
  usage-display: '{prefix}<red>/arena display <текст>'
  exists: '{prefix}<red>Арена <white>{arena}</white> уже есть. Используй /arena edit {arena}.'
  created: '{prefix}<green>Создаю арену <white>{arena}</white>. Отметь /arena pos1 и /arena pos2, точки и режимы, потом /arena save.'
  pos-set: '{prefix}<green>Точка {pos}: <white>{x} {y} {z}'
  spawn-set: '{prefix}<green>Спавн <white>{spawn}</white>: <gray>{x} {y} {z}'
  void-set: '{prefix}<green>Пустота ниже Y <white>{y}'
  unknown-mode: '{prefix}<red>Режимы: <white>{modes}'
  mode-added: '{prefix}<green>Режим <white>{mode}</white> включён. Нужны точки: <white>{spawns}'
  mode-removed: '{prefix}<yellow>Режим <white>{mode}</white> убран.'
  display-set: '{prefix}<green>Название: {display}'
  bad-material: '{prefix}<red>Неверный материал.'
  icon-set: '{prefix}<green>Иконка: <white>{icon}'
  setup-info:
    - '<gradient:#ff9ecf:#c9a7ff><b>Арена {arena}</b></gradient> <gray>(настройка)'
    - '<gray>Название: <white>{display}'
    - '<gray>Углы: <white>{pos1}</white> → <white>{pos2}'
    - '<gray>Режимы: <white>{modes}'
    - '<gray>Точки: <white>{spawns}'
    - '<gray>Пустота: <white>{void}'
    - '<gray>Не хватает точек: <red>{missing}'
  info:
    - '<gradient:#ff9ecf:#c9a7ff><b>Арена {arena}</b></gradient> <gray>· включена: <white>{enabled}'
    - '<gray>Название: <white>{display}'
    - '<gray>Режимы: <white>{modes}'
    - '<gray>Точки: <white>{spawns}'
    - '<gray>Схематика: <white>{schematic}</white> <gray>({size})'
    - '<gray>Пустота: <white>{void}</white> <gray>от низа схематики'
  need-region: '{prefix}<red>Отметь оба угла в одном мире: /arena pos1, /arena pos2.'
  need-mode: '{prefix}<red>Включи хотя бы один режим: /arena mode <режим>.'
  missing-spawns: '{prefix}<red>Не хватает точек: <white>{spawns}'
  spawn-other-world: '{prefix}<red>Точка {spawn} в другом мире.'
  save-failed: '{prefix}<red>Ошибка: <white>{error}'
  saved: '{prefix}<green>Арена <white>{arena}</white> сохранена ({size}, движок {engine}).'
  cancelled: '{prefix}<yellow>Настройка отменена.'
  editing: '{prefix}<green>Арена <white>{arena}</white> открыта в отдельном мире. Правь и /arena save, или /arena cancel.'
  not-found: '{prefix}<red>Арена <white>{arena}</white> не найдена.'
  deleted: '{prefix}<green>Арена <white>{arena}</white> удалена.'
  list-empty: '{prefix}<gray>Арен пока нет. /arena create <id>'
  list-header: '{prefix}<gray>Арены ({count}):'
  list-line: ' <dark_gray>•</dark_gray> <white>{arena}</white> <gray>{display} · {modes} ·</gray> {state}'
  enabled: '{prefix}<green>Арена {arena} включена.'
  disabled: '{prefix}<yellow>Арена {arena} выключена.'

game:
