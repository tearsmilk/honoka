  stats:
    header: '{prefix}<gray>Статистика <white>{player}</white>:'
    line: ' <dark_gray>•</dark_gray> {difficulty}<gray>: <green>{wins}</green> побед, <red>{losses}</red> поражений'
    clicktest: ' <dark_gray>•</dark_gray> <gray>Клик-тест: рекорд <white>{best}</white>, макс <white>{cps}</white> CPS'
  top:
    header: '{prefix}<gray>Топ клик-теста:'
