  missing-spawns: '{prefix}<red>Не хватает точек: <white>{spawns}'
  spawn-other-world: '{prefix}<red>Точка {spawn} в другом мире.'
  save-failed: '{prefix}<red>Ошибка: <white>{error}'
  saved: '{prefix}<green>Арена <white>{arena}</white> сохранена ({size}, движок {engine}).'
  cancelled: '{prefix}<yellow>Настройка отменена.'
  editing: '{prefix}<green>Арена <white>{arena}</white> открыта в отдельном мире. Правь и /arena save, или /arena cancel.'
  not-found: '{prefix}<red>Арена <white>{arena}</white> не найдена.'
  deleted: '{prefix}<green>Арена <white>{arena}</white> удалена.'
  list-empty: '{prefix}<gray>Арен пока нет. /arena create <id>'
