  go:
    title: '<green><b>В бой!</b>'
    subtitle: ''
    stay: 700
  already-in-game: '{prefix}<red>Ты уже в игре. /leave — выйти.'
  not-in-game: '{prefix}<red>Ты не в игре.'
  left: '{prefix}<gray>Ты вышел из игры.'
  stopped: '{prefix}<yellow>Игра остановлена администратором.'
  world-failed: '{prefix}<red>Не удалось подготовить арену: <white>{error}'
  command-blocked: '{prefix}<red>Эта команда недоступна в игре. /leave — выйти.'
  restored: '{prefix}<green>Прошлая игра прервалась — вещи возвращены.'
  spectating: '{prefix}<gray>Ты наблюдаешь: <white>{mode}</white> · {arena}<gray>. Выйти — <white>/leave'
  spectate-unavailable: '{prefix}<red>Эта игра уже закончилась или недоступна.'

bots:
  help:
    - '<gradient:#ff9ecf:#c9a7ff><b>Боты</b></gradient>'
    - '<white>/bot</white> <gray>— меню выбора'
    - '<white>/bot duel [1.8|1.9] [easy|medium|hard] [арена]</white> <gray>— дуэль с ботом'
    - '<white>/bot clicktest [1.8|1.9] [сложность] [арена]</white> <gray>— клик-тест: бесконечное сумо 10 минут'
