# Валюта «Опыт» (для косметики и режима в целом). Хранится в data.db → miharu_xp.
# Даётся в конце игры: play — каждому, кто доиграл, win — сверху победителю. Кто вышел из игры (/leave, выход) — без опыта.
# Скорборд лобби — {xp}, PlaceholderAPI — %miharu_xp%.
# Команды: /xp [игрок] · /xp give|take|set <игрок> <число> (OP) · /xptop place|remove|refresh (OP) — голограмма топа.
# Без опыта: игры с ботами и игры, где одновременно было меньше min-players живых игроков.
min-players: 2
play: 5
win: 15
# свои суммы по режимам: ключ — начало id режима (самое длинное совпадение)
#   mg-<мини-игра> (mg-bedwars, mg-skycontrol…), m-<кит 1.9>, <кит 1.8>, custom-18 / custom-19, mup- (митапы)
modes:
  mg-:
    play: 10
    win: 25
  mup-:
    play: 10
    win: 40
hologram:
  height: 2.0                   # на сколько выше игрока ставить при /xptop place
  size: 10                      # мест в топе
  refresh-seconds: 60
  line-spacing: 0.27            # расстояние между строками (армор-стенды, как HolographicDisplays)
  header:
    - '<gradient:#7fd4ff:#c9a7ff><b>ТОП ПО ОПЫТУ</b></gradient>'
    - ''
  line: '<gray>#{place} <white>{player} <dark_gray>— <#7fd4ff>{xp}xp'
  empty-line: '<dark_gray>#{place} —'
  footer:
    - ''
    - '<gray>Опыт — за игры и победы'

# Косметика → «Экипировка»: сеты отделок брони. Купить за опыт (перо), потом «Применить».
# В играх на надетую броню игрока накладывается его отделка (любая броня, видят все).
# pieces: «узор:материал». Узоры: sentry, dune, coast, wild (дебри), ward, eye, vex, tide, snout, rib, spire,
#   wayfinder, shaper, silence, raiser, host, flow (поток), bolt. Материалы: quartz, iron, netherite, redstone,
#   copper, gold, emerald, diamond, lapis, amethyst, resin.
# column — колонка меню (0–8): 4 части сверху вниз, перо — в 6-м ряду.
armor-trims:
  title: '<dark_gray>Экипировка'
  sets:
    dune:
      name: '<#b48cff>Дюна'
      price: 300
      column: 2
      pieces:
        helmet: dune:amethyst
        chestplate: dune:emerald
        leggings: dune:amethyst
        boots: dune:emerald
    wild:
      name: '<#7fd4ff>Дебри'
      price: 500
      column: 4
      pieces:
        helmet: wild:diamond
        chestplate: wild:diamond
        leggings: wild:diamond
        boots: wild:diamond
    flow:
      name: '<#ffd36b>Поток'
      price: 1000
      column: 6
      pieces:
        helmet: flow:gold
        chestplate: flow:gold
        leggings: flow:gold
        boots: flow:gold
  piece-lore:
    - '<gray>Отделка на любую твою броню в играх'
  button:
    buy:
      material: FEATHER
      name: '{set} <gray>· <#7fd4ff>{price}xp'
      lore:
        - '<gray>Полный сет отделки брони'
        - '<gray>Твой опыт: <white>{xp}xp'
        - ''
        - '<yellow>▶ Купить'
    owned:
      material: FEATHER
      name: '{set} <gray>· куплено'
      lore:
        - '<gray>Полный сет отделки брони'
        - ''
        - '<yellow>▶ Применить'
    active:
      material: FEATHER
      name: '{set} <green>· выбрано'
      lore:
        - '<gray>Накладывается на твою броню в играх'
        - ''
        - '<gray>▶ Нажми ещё раз, чтобы снять'
  filler:
    enabled: false
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
