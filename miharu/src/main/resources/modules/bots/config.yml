# ═══ Модуль ботов ═══
# Боты — фейк-игроки из пакетов: на сервере сущности нет, физика и ИИ считаются плагином.

bot:
  names: ['Miharu', 'MiharuBot', 'Hikari', 'Sakura']
  show-in-tab: false
  below-name: '<red>❤'
  # Скин: none (по UUID) | opponent (как у игрока) | fixed (value/signature ниже) | name (скачать скин ника)
  skin:
    mode: none
    name: ''
    value: ''
    signature: ''

modes:
  bot-duel:
    enabled: true
    display: 'Дуэль с ботом'
    countdown-seconds: 3
    max-duration-seconds: 300   # потом ничья (0 — без лимита)
    spectate-on-loss: true
    liquid-is-void: false
    kits:                       # кит по версии PvP (modules/bots/kits.yml)
      "1.8": duel-1.8
      "1.9": duel-1.9
  clicktest:
    enabled: true
    display: 'Клик-тест'
    countdown-seconds: 3
    duration-seconds: 600       # 10 минут бесконечного сумо
    rank-by: clicks             # clicks — по кликам, hits — по попаданиям
    liquid-is-void: true        # вода = падение
    save-unfinished: false      # сохранять результат, если вышел раньше
    kits:
      "1.8": clicktest
      "1.9": clicktest

# Сложности. Любую можно добавить/переименовать — меню и команды подхватят.
# reach — дальность удара бота, cps — клики в секунду, miss-chance — шанс промаха,
# aim.hit-angle — макс. угол от прицела до цели для попадания, aim.turn-speed — градусов поворота за тик,
# aim.error — дрожание прицела, aim.reaction-ticks — с какой задержкой бот «видит» игрока,
# aim.lead — упреждение по скорости цели (тиков), movement.* — движение, combat.* — тактика.
# В 1.9 бот всегда ждёт зарядку удара: cooldown-threshold — с какой зарядки бьёт, charge-delay-ticks — реакция.
# Скорость атаки оружия — modules/pvp/config.yml → versions."1.9".weapon-speed (меч 1.6 = удар раз в 12.5 тиков).
difficulties:
  easy:
    display: '<green>Лёгкий'
    name-prefix: '<green>[Лёгкий] '
    health: 20
    reach: 2.6
    cps: {min: 4, max: 6}
    miss-chance: 0.35
    aim: {hit-angle: 35, turn-speed: 9, error: 7, reaction-ticks: 6, lead: 0}
    movement:
      speed: 0.92
      keep-distance: 0.8
      strafe-chance: 0.0
      strafe-ticks: {min: 20, max: 40}
      jump-chance: 0.0
      w-tap: false
    combat:
      crit-jump: false
      cooldown-aware: false
      cooldown-threshold: 0.75  # 1.9: бьёт при 75% зарядки (удары слабее)
      charge-delay-ticks: {min: 3, max: 8}   # 1.9: опаздывает с кликом после зарядки
      block-hit: false
      swing-out-of-range: true
  medium:
    display: '<yellow>Средний'
    name-prefix: '<yellow>[Средний] '
    health: 20
    reach: 2.9
    cps: {min: 7, max: 10}
    miss-chance: 0.18
    aim: {hit-angle: 28, turn-speed: 16, error: 4, reaction-ticks: 4, lead: 1}
    movement:
      speed: 1.0
      keep-distance: 0.6
      strafe-chance: 0.45
      strafe-ticks: {min: 15, max: 35}
      jump-chance: 0.01
      w-tap: false
    combat:
      crit-jump: false
      cooldown-aware: true
      cooldown-threshold: 0.9
      charge-delay-ticks: {min: 1, max: 4}
      block-hit: false
      swing-out-of-range: true
  hard:
    display: '<red>Сложный'
    name-prefix: '<red>[Сложный] '
    health: 20
    reach: 3.0
    cps: {min: 11, max: 14}
    miss-chance: 0.07
    aim: {hit-angle: 22, turn-speed: 28, error: 2, reaction-ticks: 2, lead: 2}
    movement:
      speed: 1.0
      keep-distance: 0.4
      strafe-chance: 0.75
      strafe-ticks: {min: 10, max: 25}
      jump-chance: 0.02
      w-tap: true               # сброс спринта после удара — каждая атака с полной отдачей
      w-tap-ticks: {min: 2, max: 4}
    combat:
      crit-jump: true           # 1.9: прыгает под крит
      cooldown-aware: true
      cooldown-threshold: 0.97
      charge-delay-ticks: {min: 0, max: 1}
      block-hit: true           # 1.8: блок мечом между ударами
      block-chance: 0.25
      swing-out-of-range: false
