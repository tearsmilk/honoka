        - '<gray>Команды по 2 · 2 команды'
        - ''
        - '<yellow>▶ Играть'
    duo4:
      slot: 15
      display: '2x4'
      queue: mup-24
      material: IRON_CHESTPLATE
      hide-attributes: true
      name: '<#b48cff><b>2x4</b>'
