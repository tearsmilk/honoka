  title: '<dark_gray>Митапы'
  rows: 3
  filler:
    enabled: true
    material: PURPLE_STAINED_GLASS_PANE
    name: ' '
  modes:
    solo2:
      slot: 4
      display: '1x2'
      queue: mup-12
      material: PURPLE_SHULKER_BOX
      name: '<#b48cff><b>1x2</b> <gray>· тест'
      lore:
        - '<gray>Тестовый митап на двоих'
        - ''
        - '<yellow>▶ Играть'
    solo4:
      slot: 10
      display: '1x4'
      queue: mup-14
      material: IRON_SWORD
      hide-attributes: true
      name: '<#b48cff><b>1x4</b>'
      lore:
        - '<gray>Каждый сам за себя · 4 игрока'
        - ''
        - '<yellow>▶ Играть'
    solo8:
      slot: 11
      display: '1x8'
      queue: mup-18
      material: DIAMOND_SWORD
      hide-attributes: true
      name: '<#b48cff><b>1x8</b>'
