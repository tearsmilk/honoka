# ═══ Модуль лобби ═══
# Лобби = все миры, кроме миров игр (или только перечисленные в worlds).
worlds: []

# Спавн лобби: /setlobby
spawn:
  set: false
  world: world
  x: 0.5
  y: 100
  z: 0.5
  yaw: 0
  pitch: 0
teleport-on-join: true
teleport-on-return: false   # после игры — на спавн лобби (иначе туда, где стоял)

on-join:
  clear-inventory: true
  gamemode: ADVENTURE
  heal: true

# Защита лобби (право miharu.lobby.bypass — игнорировать)
protect:
  damage: true
  hunger: true
  drop: true
  build: true
  inventory: true
  void-y: -64

# Предметы. action: duels (1.8) | minigames | duels-1.9 | stats | cosmetics | meetups | spectate | leave-queue | bots | clicktest | command:<команда> | none
# show: always | in-queue | not-in-queue
items:
  duels:
    slot: 0
    show: not-in-queue
    action: duels
    material: STONE_SWORD
    hide-attributes: true
    name: '<#ff9ecf><b>Дуэли</b> <gray>(ПКМ)'
    lore:
      - '<gray>Выбери кит и сыграй'
      - '<gray>с ботом или с игроком.'
  minigames:
    slot: 1
    show: not-in-queue
    action: minigames
    material: FIRE_CHARGE
    name: '<#ff8a3b><b>Мини-игры</b> <gray>(ПКМ)'
    lore:
      - '<gray>BedWars, SkyWars, The Bridge,'
      - '<gray>Fireball Fight, Sumo, MLG Rush — 1x1.'
  duels-modern:
    slot: 2
    show: not-in-queue
    action: duels-1.9
    material: GOLDEN_SWORD
    hide-attributes: true
    name: '<gold><b>Дуэли 1.9</b> <gray>(ПКМ)'
    lore:
      - '<gray>Медленное PvP: щиты, топоры,'
      - '<gray>булава, трезубец, копья.'
  cosmetics:
    slot: 4
    show: not-in-queue
    action: cosmetics
    material: NETHER_STAR
    name: '<#ffd6f5><b>Косметика</b> <gray>(ПКМ)'
    lore:
      - '<gray>Украшения для брони, палки и теги.'
  leave-queue:
    slot: 4
    show: in-queue
    action: leave-queue
    material: RED_DYE
    name: '<red><b>Выйти из очереди</b> <gray>(ПКМ)'
    lore:
      - '<gray>Ищем соперника: {queue_kit}'
  stats:
    slot: 6
    show: always
    action: stats
    material: BOOK
    name: '<#ffd23b><b>Статистика</b> <gray>(ПКМ)'
    lore:
      - '<gray>Победы и поражения по режимам.'
  meetups:
    slot: 7
    show: not-in-queue
    action: meetups
    material: PURPLE_SHULKER_BOX
    name: '<#b48cff><b>Митапы</b> <gray>(ПКМ)'
    lore:
      - '<gray>1x2 (тест), 1x4, 1x8, 1x16, 2x2, 2x4, 2x8'
  spectate:
    slot: 8
    show: always
    action: spectate
    material: ENDER_EYE
    name: '<#c9a7ff><b>Наблюдать</b> <gray>(ПКМ)'
    lore:
      - '<gray>Смотреть активные игры.'
      - '<gray>Выйти — <white>/leave'

# Меню митапов (шалкер в 8-м слоте). queue — режим митапа (modules/duels/config.yml → meetups.modes).
# Ключи режимов без точек; display — как показать в сообщении.
# Меню косметики (предмет в 5-м слоте). action кнопки: soon (сообщение «скоро») или command:<команда>
cosmetics-menu:
  title: '<dark_gray>Косметика'
  rows: 3
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  buttons:
    armor:
      slot: 11
      action: soon
      material: DIAMOND_CHESTPLATE
      hide-attributes: true
      glow: true
      name: '<#7fd4ff><b>Украшения для брони</b>'
      lore:
        - '<gray>Узоры и отделка на броню в играх.'
        - ''
        - '<yellow>▶ Открыть'
    stick:
      slot: 13
      action: soon
      material: STICK
      glow: true
      name: '<#ffd36b><b>Украшения для палки</b> <gray>(сумо)'
      lore:
        - '<gray>Вид палки с отдачей в сумо.'
        - ''
        - '<yellow>▶ Открыть'
    tags:
      slot: 15
      action: soon
      material: NAME_TAG
      name: '<#ff9ecf><b>Теги</b>'
      lore:
        - '<gray>Тег рядом с ником в чате и табе.'
        - ''
        - '<yellow>▶ Открыть'

