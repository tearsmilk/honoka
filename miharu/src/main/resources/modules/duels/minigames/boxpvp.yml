# BoxPvP 1x4 / 2x4 / 3x4 / 4x4: мини-лобби → выбор класса (PvP только 1.9) → бой за квадрат 3x3.
# Поставь все 9 блоков шерсти своего цвета и удержи их (boxpvp.hold-time в modules/duels/config.yml, по умолчанию 3 с).
# Классы — ниже в classes (формат как у китов дуэлей: armor, items, effects, icon). Каждому дополнительно: 64 шерсти и ножницы.
# effects: 'эффект:уровень(0 = I):длительность в тиках' — выдаются при каждом появлении.
display: '<#5fd6c4>BoxPvP'
version: "1.9"
arena-mode: boxpvp        # режимы арены box-quatro / box-2x4 / box-3x4 / box-4x4
rounds: 1
# точки арены: p1..p4 — места появления в бою, pre1..pre4 — места в мини-лобби,
# box — встань на ЦЕНТРАЛЬНЫЙ блок квадрата 3x3 (под ногами) и поставь точку
# режимы: размер команды × 4 команды. 1 → 1x4 (каждый сам за себя), 2 → 2x4, 3 → 3x4, 4 → 4x4.
# В командах один класс — только у одного игрока команды (взял напарник Мечника — тебе Мечник недоступен).
# Точки те же для всех режимов: p1..p4, pre1..pre4 — по одной на команду (напарники появляются вместе), и box.
# Режимы арены: box-quatro (1x4), box-2x4, box-3x4, box-4x4 — можно повесить все на одну арену.
team-sizes:
  - 1
  - 2
  - 3
  - 4
teams: 4
players-suffix: '<gray>· {format}'
player-points:
  - pre
extra-points:
  - box
rules:
  build: true
  break-placed-only: false
  natural-regen: true
  hunger: false
  max-duration-seconds: 900   # по истечении побеждает тот, у кого больше своих блоков в квадрате

