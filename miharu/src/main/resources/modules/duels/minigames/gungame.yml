# GunGame — PvP-режим на 30 уровней (PvP 1.8). За 3–4 убийства — следующий уровень и новый комплект:
# старая экипировка полностью заменяется. За смерть уровень не понижается. На последнем уровне — final-kills убийств и победа.
# Уровни 27–30 — только лук (27 — без чар, 28 — Power I, 29 — Power III, 30 — Power V). Предметы неломаемые (без Unbreaking). Запрещены Flame, Punch, Thorns, Feather Falling.
# levels — комплекты по порядку (формат как у китов дуэлей: armor, items, name — подпись уровня).
display: '<#ffb347>GunGame'
version: "1.8"
arena-mode: gungame       # режим арены gg-8: точки p1..p8 (после смерти — случайная из них)
rounds: 1
players:
  - 8
players-suffix: '<gray>· {format}'
quick-start-min: 2        # быстрый старт уже от 2 игроков
armor: {}
items: {}
rules:
  damage: true
  hunger: false
  natural-regen: true
  void-lose: false
  max-duration-seconds: 1800    # по истечении побеждает тот, у кого выше уровень (при равенстве — больше убийств)

gungame:
  kills-per-level-min: 3        # убийств для следующего уровня: случайно от min до max (заново на каждом уровне)
  kills-per-level-max: 4
  final-kills: 1                # убийств на последнем уровне для победы
  kill-credit-seconds: 10       # убийство засчитывается, если последний удар был не раньше N секунд (в т.ч. скинул в пустоту)
  spawn-protection-seconds: 2   # неуязвимость после возрождения (снимается, если сам ударил)
  heal-on-kill: true            # за убийство — полное здоровье
  natural-regen: true

