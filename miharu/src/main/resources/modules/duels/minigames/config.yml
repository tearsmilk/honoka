# Меню мини-игр (огненный заряд во 2-м слоте лобби). Все 1x1, только против игрока, PvP 1.8.
# kits.<файл>: enabled, slot, icon. Сама игра — <файл>.yml рядом (id в очереди: mg-<файл>, с вариантом — mg-bridge-5).
