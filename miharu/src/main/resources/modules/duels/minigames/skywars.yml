# Мини-игра 1x1 (только против игрока, всегда PvP 1.8). Формат как у китов дуэлей (modules/duels/kits/).
# Слоты: 0–8 хотбар, 9–35 инвентарь. team-color: кожа и WHITE_* блоки красятся в цвет команды.
display: '<aqua>SkyWars'
version: "1.8"
arena-mode: skywars       # арена: p1, p2 (острова). Сундуки на арене заполнятся лутом при старте
rounds: 1
items:
  0:
    material: WOODEN_PICKAXE
    unbreakable: true
  1:
    material: WOODEN_AXE
    unbreakable: true
rules:
  build: true
  break-placed-only: false   # ломать можно всё
  chest-loot: skywars        # таблица лута: modules/duels/config.yml → loot-tables.skywars
  natural-regen: true
