# ═══ Модуль дуэлей ═══
# Киты 1.8: папка kits/, киты 1.9 (медленное PvP): папка kits-1.9/, мини-игры: папка minigames/.
# В каждой: config.yml — меню и включение, <id>.yml — содержимое и правила.
# Арены: режимы duel (p1, p2), sumo (p1, p2), bridge (p1, p2, goal1, goal2), mlg (p1, p2, bed1, bed2).
#   /arena mode duel и т.д. Кит выбирает режим арены в arena-mode. Бот встаёт на p2.

countdown-seconds: 3
spectate-on-loss: true

# Золотая голова (golden-head: true в предмете кита): эффекты после съедания
golden-head:
  effects:
    - regeneration:1:180
    - absorption:0:2400

# Режимы арен по числу игроков для мини-игр с вариантами 1x1/1x3/1x4:
# <короткое имя>-<размер>, например sw-duo (2 игрока), sw-trio (3), sw-quatro (4); bw-*, br-*, fb-*, sumo-*, box-quatro.
# /arena mode sw-trio — плагин скажет, какие точки нужны. Старые арены с общим режимом (skywars) тоже подходят.
arena-short:
  skywars: sw
  bedwars: bw
  bridge: br
  fireball: fb
  sumo: sumo
  boxpvp: box
  bowspleef: bs
  gungame: gg
  skycontrol: sc
arena-size-names:
  '2': duo
  '3': trio
  '4': quatro

# Снежки и яйца толкают игроков (SkyWars и другие игры с китами)
snowball:
  enabled: true
  horizontal: 0.4
  vertical: 0.32

# Отдача от удочки, как в 1.8
rod:
  horizontal: 0.4
  vertical: 0.36

# Фаерболы (Fireball Fight, rules.fireball: true): ПКМ огненным зарядом
fireball:
  speed: 1.2
  yield: 2.0
  cooldown-ticks: 10
  damage-multiplier: 0.35     # урон по игрокам от фаербола
# TNT (rules.auto-tnt: true): поджигается сразу после установки
tnt:
  fuse-ticks: 40
  yield: 3.0
  damage-multiplier: 0.5

# Лут сундуков (rules.chest-loot: <таблица>). weight — вес, min/max — количество.
loot-tables:
  skywars:
    rolls:
      min: 4
      max: 7
    items:
      - material: STONE_SWORD
        weight: 10
      - material: IRON_SWORD
        weight: 6
      - material: DIAMOND_SWORD
        weight: 2
      - material: IRON_HELMET
        weight: 6
      - material: IRON_CHESTPLATE
        weight: 5
      - material: IRON_LEGGINGS
        weight: 5
      - material: IRON_BOOTS
        weight: 6
      - material: DIAMOND_CHESTPLATE
        weight: 1
      - material: DIAMOND_BOOTS
        weight: 2
      - material: BOW
        weight: 4
      - material: ARROW
        weight: 6
        min: 4
        max: 12
      - material: STONE
        weight: 12
        min: 16
        max: 32
      - material: OAK_PLANKS
        weight: 10
        min: 16
        max: 32
      - material: GOLDEN_APPLE
        weight: 5
        min: 1
        max: 2
      - material: COOKED_BEEF
        weight: 8
        min: 2
        max: 6
      - material: ENDER_PEARL
        weight: 3
      - material: SNOWBALL
        weight: 5
        min: 4
        max: 8
      - material: WATER_BUCKET
        weight: 3
      - material: LAVA_BUCKET
        weight: 2
      - material: IRON_PICKAXE
        weight: 4
      - material: SPLASH_POTION
        potion: healing
        weight: 3

menus:
  # Выбор варианта: длина матча (The Bridge 3/5/7, MLG Rush 5/10/20) или число игроков (SkyWars 1x1/1x3/1x4)
  # {variant_info} — «Играем до 5 голов» или «Игроков в матче: 4»
  variants:
    title: '<dark_gray>{kit} <gray>· до скольких'
    rows: 3
    slots:
      - 11
      - 13
      - 15
    icon:
      material: TARGET
      name: '{kit}'
      lore:
        - '{variant_info}'
        - '<gray>В очереди: <white>{queue}'
        - ''
        - '<yellow>▶ Искать соперника'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  # Шаг 2: с кем играть
  opponent:
    title: '<dark_gray>{kit} <gray>· соперник'
    rows: 3
    bot:
      slot: 11
      material: ZOMBIE_HEAD
      name: '<#ff9ecf><b>Бот</b>'
      lore:
        - '<gray>Сразу в бой, без ожидания.'
        - '<gray>Выбери сложность на следующем шаге.'
    player:
      slot: 15
      material: PLAYER_HEAD
      name: '<#c9a7ff><b>Игрок</b>'
      lore:
        - '<gray>Очередь на {kit}<gray>.'
        - '<gray>В очереди: <white>{queue}</white> · играют: <white>{playing}'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'
  # Шаг 3: сложность бота (ключи — id сложностей из modules/bots/config.yml)
  difficulty:
    title: '<dark_gray>{kit} <gray>· сложность бота'
    rows: 3
    items:
      easy:
        slot: 11
        material: LIME_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - ''
          - '<yellow>▶ Играть'
      medium:
        slot: 13
        material: YELLOW_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - ''
          - '<yellow>▶ Играть'
      hard:
        slot: 15
        material: RED_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - '<gray>Стрейфы, w-tap, блок-хит.'
          - ''
          - '<yellow>▶ Играть'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'

# ═══ Рейтинговые дуэли (незеритовый меч в лобби, /ranked) ═══
# Только игроки. ELO отдельно на каждый кит, старт start-elo, может уходить в минус.
ranked:
  start-elo: 0
  k-factor: 32               # сколько максимум можно получить/потерять за матч
  # подбор соперника: разница ELO не больше окна, окно растёт пока ждёшь
  match-range:
    start: 100
    grow-per-10s: 50
    max: 1000
  # PvP-тиры: отдельно для каждого кита (режима). Сверху вниз; тир = первый, чей min-elo <= ELO игрока.
  # Ручной тир: /tier set <игрок> <кит> <тир> (auto — снова из ELO). Пока игр меньше min-games — «без тира».
  tiers:
    min-games: 3
    unranked: '<gray>Без тира'
    list:
      - id: HT1
        name: Высший уровень
        display: '<#ff3b3b><b>HT1</b>'
        min-elo: 1000
      - id: LT1
        name: Очень высокий
        display: '<#ff6a3b><b>LT1</b>'
        min-elo: 800
      - id: HT2
        name: Сильный
        display: '<#ffa23b>HT2'
        min-elo: 600
      - id: LT2
        name: Выше среднего
        display: '<#ffd23b>LT2'
        min-elo: 450
      - id: HT3
        name: Средний
        display: '<#b6e34a>HT3'
        min-elo: 300
      - id: LT3
        name: Ниже среднего
        display: '<#5fd68a>LT3'
        min-elo: 200
      - id: HT4
        name: Слабый
        display: '<#4ac7e3>HT4'
        min-elo: 100
      - id: LT4
        name: Очень слабый
        display: '<#6a8cff>LT4'
        min-elo: 0
      - id: HT5
        name: Начальный
        display: '<#a07bff>HT5'
        min-elo: -100
      - id: LT5
        name: Самый низкий
        display: '<#9a9a9a>LT5'
        min-elo: -1000000
  # какие киты рейтинговые (id из kits/ и kits-1.9/; у китов 1.9 приставка m-)
  kits-1.8:
    - diamond
  kits-1.9:
    - m-diamond
  menu:
    title: '<dark_gray>Рейтинг <gray>· PvP {version}'
    rows: 4
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    # переключатель сверху
    tab-1.8:
      slot: 3
      normal:
        material: STONE_SWORD
        hide-attributes: true
        name: '<gray>1.8 · быстрое'
        lore:
          - '<yellow>▶ Показать киты 1.8'
      selected:
        material: STONE_SWORD
        hide-attributes: true
        glow: true
        name: '<#ff9ecf><b>1.8 · быстрое</b>'
        lore:
          - '<green>✔ Выбрано'
    tab-1.9:
      slot: 5
      normal:
        material: GOLDEN_SWORD
        hide-attributes: true
        name: '<gray>1.9 · медленное'
        lore:
          - '<yellow>▶ Показать киты 1.9'
      selected:
        material: GOLDEN_SWORD
        hide-attributes: true
        glow: true
        name: '<gold><b>1.9 · медленное</b>'
        lore:
          - '<green>✔ Выбрано'
    # слоты под киты выбранной версии (по порядку из kits-1.8 / kits-1.9)
    kit-slots:
      - 22
      - 21
      - 23
      - 20
      - 24
      - 19
      - 25
    kit-icon:
      material: NETHERITE_SWORD
      hide-attributes: true
      name: '{kit} <gray>· рейтинг'
      lore:
        - '<gray>Тир: {tier} <gray>· ELO <white>{elo}'
        - '<gray>Победы: <green>{wins}</green> · поражения: <red>{losses}'
        - '<gray>В очереди: <white>{queue}</white> · играют: <white>{playing}'
        - ''
        - '<yellow>▶ Искать соперника'
    # своя иконка кита: kit-icons.<id> (у китов 1.9 — m_<кит>, например m_diamond)
    kit-icons:
      diamond:
        material: DIAMOND_SWORD
        hide-attributes: true
        name: '{kit} <gray>· 1.8 рейтинг'
        lore:
          - '<gray>Тир: {tier} <gray>· ELO <white>{elo}'
          - '<gray>Победы: <green>{wins}</green> · поражения: <red>{losses}'
          - '<gray>В очереди: <white>{queue}'
          - ''
          - '<yellow>▶ Искать соперника'
      m_diamond:
        material: DIAMOND_SWORD
        hide-attributes: true
        glow: true
        name: '{kit} <gray>· 1.9 рейтинг'
        lore:
          - '<gray>Тир: {tier} <gray>· ELO <white>{elo}'
          - '<gray>Победы: <green>{wins}</green> · поражения: <red>{losses}'
          - '<gray>В очереди: <white>{queue}'
          - ''
          - '<yellow>▶ Искать соперника'
    empty:
      slot: 22
      material: BARRIER
      name: '<gray>Нет рейтинговых китов'

# ═══ Статистика (предмет в 7-м слоте лобби, /stats [игрок]) ═══
