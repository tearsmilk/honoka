# ═══ Модуль дуэлей ═══
# Киты 1.8: папка kits/, киты 1.9 (медленное PvP): папка kits-1.9/, мини-игры: папка minigames/.
# В каждой: config.yml — меню и включение, <id>.yml — содержимое и правила.
# Арены: режимы duel (p1, p2), sumo (p1, p2), bridge (p1, p2, goal1, goal2), mlg (p1, p2, bed1, bed2).
#   /arena mode duel и т.д. Кит выбирает режим арены в arena-mode. Бот встаёт на p2.

countdown-seconds: 3
spectate-on-loss: true

# Золотая голова (golden-head: true в предмете кита): эффекты после съедания
golden-head:
  effects:
    - regeneration:1:180
    - absorption:0:2400

# Режимы арен по числу игроков для мини-игр с вариантами 1x1/1x3/1x4:
# <короткое имя>-<размер>, например sw-duo (2 игрока), sw-trio (3), sw-quatro (4); bw-*, br-*, fb-*, sumo-*, box-quatro.
# /arena mode sw-trio — плагин скажет, какие точки нужны. Старые арены с общим режимом (skywars) тоже подходят.
arena-short:
  skywars: sw
  bedwars: bw
  bridge: br
  fireball: fb
  sumo: sumo
  boxpvp: box
  bowspleef: bs
  gungame: gg
  skycontrol: sc
arena-size-names:
  '2': duo
  '3': trio
  '4': quatro

# Снежки и яйца толкают игроков (SkyWars и другие игры с китами)
snowball:
  enabled: true
  horizontal: 0.4
  vertical: 0.32

# Отдача от удочки, как в 1.8
rod:
  horizontal: 0.4
  vertical: 0.36

# Фаерболы (Fireball Fight, rules.fireball: true): ПКМ огненным зарядом
fireball:
  speed: 1.2
  yield: 2.0
  cooldown-ticks: 10
  damage-multiplier: 0.35     # урон по игрокам от фаербола
# TNT (rules.auto-tnt: true): поджигается сразу после установки
tnt:
  fuse-ticks: 40
  yield: 3.0
  damage-multiplier: 0.5

# Лут сундуков (rules.chest-loot: <таблица>). weight — вес, min/max — количество.
loot-tables:
  skywars:
    rolls:
      min: 4
      max: 7
    items:
      - material: STONE_SWORD
        weight: 10
      - material: IRON_SWORD
        weight: 6
      - material: DIAMOND_SWORD
        weight: 2
      - material: IRON_HELMET
        weight: 6
      - material: IRON_CHESTPLATE
        weight: 5
      - material: IRON_LEGGINGS
        weight: 5
      - material: IRON_BOOTS
        weight: 6
      - material: DIAMOND_CHESTPLATE
        weight: 1
      - material: DIAMOND_BOOTS
        weight: 2
      - material: BOW
        weight: 4
      - material: ARROW
        weight: 6
        min: 4
        max: 12
      - material: STONE
        weight: 12
        min: 16
        max: 32
      - material: OAK_PLANKS
        weight: 10
        min: 16
        max: 32
      - material: GOLDEN_APPLE
        weight: 5
        min: 1
        max: 2
      - material: COOKED_BEEF
        weight: 8
        min: 2
        max: 6
      - material: ENDER_PEARL
        weight: 3
      - material: SNOWBALL
        weight: 5
        min: 4
        max: 8
      - material: WATER_BUCKET
        weight: 3
      - material: LAVA_BUCKET
        weight: 2
      - material: IRON_PICKAXE
        weight: 4
      - material: SPLASH_POTION
        potion: healing
        weight: 3

menus:
  # Выбор варианта: длина матча (The Bridge 3/5/7, MLG Rush 5/10/20) или число игроков (SkyWars 1x1/1x3/1x4)
  # {variant_info} — «Играем до 5 голов» или «Игроков в матче: 4»
  variants:
    title: '<dark_gray>{kit} <gray>· до скольких'
    rows: 3
    slots:
      - 11
      - 13
      - 15
    icon:
      material: TARGET
      name: '{kit}'
      lore:
        - '{variant_info}'
        - '<gray>В очереди: <white>{queue}'
        - ''
        - '<yellow>▶ Искать соперника'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  # Шаг 2: с кем играть
  opponent:
    title: '<dark_gray>{kit} <gray>· соперник'
    rows: 3
    bot:
      slot: 11
      material: ZOMBIE_HEAD
      name: '<#ff9ecf><b>Бот</b>'
      lore:
        - '<gray>Сразу в бой, без ожидания.'
        - '<gray>Выбери сложность на следующем шаге.'
    player:
      slot: 15
      material: PLAYER_HEAD
      name: '<#c9a7ff><b>Игрок</b>'
      lore:
        - '<gray>Очередь на {kit}<gray>.'
        - '<gray>В очереди: <white>{queue}</white> · играют: <white>{playing}'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'
  # Шаг 3: сложность бота (ключи — id сложностей из modules/bots/config.yml)
  difficulty:
    title: '<dark_gray>{kit} <gray>· сложность бота'
    rows: 3
    items:
      easy:
        slot: 11
        material: LIME_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - ''
          - '<yellow>▶ Играть'
      medium:
        slot: 13
        material: YELLOW_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - ''
          - '<yellow>▶ Играть'
      hard:
        slot: 15
        material: RED_DYE
        name: '{difficulty}'
        lore:
          - '<gray>CPS <white>{cps_min}-{cps_max}</white> · reach <white>{reach}'
          - '<gray>Стрейфы, w-tap, блок-хит.'
          - ''
          - '<yellow>▶ Играть'
    back:
      slot: 22
      material: ARROW
      name: '<gray>← Назад'

# ═══ Статистика (книга в лобби, /stats) ═══
stats-menu:
  title: '<dark_gray>Статистика <gray>· {player}'
  rows: 5
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  head:
    slot: 4
    material: PLAYER_HEAD
    name: '<#ff9ecf><b>{player}</b>'
    lore:
      - '<gray>Дуэли: <green>{duel_wins}</green> / <red>{duel_losses}'
      - '<gray>Боты: <green>{bot_wins}</green> / <red>{bot_losses}'
  summary:
    duels-fast:
      slot: 38
      material: STONE_SWORD
      hide-attributes: true
      name: '<#ff9ecf>Дуэли 1.8'
      lore:
        - '<gray>Победы: <green>{duel_wins_fast}'
        - '<gray>Поражения: <red>{duel_losses_fast}'
    duels-slow:
      slot: 39
      material: GOLDEN_SWORD
      hide-attributes: true
      name: '<gold>Дуэли 1.9'
      lore:
        - '<gray>Победы: <green>{duel_wins_slow}'
        - '<gray>Поражения: <red>{duel_losses_slow}'
    bots:
      slot: 41
      material: ZOMBIE_HEAD
      name: '<#c9a7ff>Боты'
      lore:
        - '<gray>Победы: <green>{bot_wins}'
        - '<gray>Поражения: <red>{bot_losses}'
    clicktest:
      slot: 42
      material: SLIME_BALL
      name: '<#c9a7ff>Клик-тест'
      lore:
        - '<gray>Рекорд: <white>{clicktest_best}'
        - '<gray>Макс CPS: <white>{clicktest_cps}'

# ═══ Раскладка китов (/kit edit) ═══
# Игрок двигает предметы кита как хочет; раскладка сохраняется (data.db) и применяется во всех играх с этим китом.
kit-editor:
  menu:
    title: '<dark_gray>Раскладка китов'
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    tab-legacy:
      slot: 2
      normal:
        material: STONE_SWORD
        hide-attributes: true
        name: '<gray>Дуэли 1.8'
      selected:
        material: STONE_SWORD
        hide-attributes: true
        glow: true
        name: '<#ff9ecf><b>Дуэли 1.8</b>'
    tab-modern:
      slot: 4
      normal:
        material: GOLDEN_SWORD
        hide-attributes: true
        name: '<gray>Дуэли 1.9'
      selected:
        material: GOLDEN_SWORD
        hide-attributes: true
        glow: true
        name: '<gold><b>Дуэли 1.9</b>'
    tab-minigames:
      slot: 6
      normal:
        material: FIRE_CHARGE
        name: '<gray>Мини-игры'
      selected:
        material: FIRE_CHARGE
        glow: true
        name: '<#ff8a3b><b>Мини-игры</b>'
    kit-slots:
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    default-icon:
      material: PAPER
      name: '{kit}'
  editor:
    title: '<dark_gray>Раскладка · {kit}'
    separator:
      material: BLACK_STAINED_GLASS_PANE
      name: '<gray>↑ инвентарь · хотбар ↑'
    bottom-filler:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    reset:
      slot: 45
      material: BARRIER
      name: '<red><b>Сбросить</b>'
      lore:
        - '<gray>Вернуть раскладку по умолчанию'
    save:
      slot: 49
      material: LIME_CONCRETE
      name: '<green><b>Сохранить и выйти</b>'
      lore:
        - '<gray>Предметы будут лежать так в каждой игре'
    cancel:
      slot: 53
      material: RED_CONCRETE
      name: '<gray>Отмена'
      lore:
        - '<gray>Закрыть без сохранения'

# ═══ Свои киты (/kit create): до 3 китов из предметов всех китов ═══
custom-kits:
  display: '<#c9a7ff>Свой кит <gray>{version}'
  default-name: 'Свой кит #{slot}'
  # правила игры в очереди «Свой кит» (как rules в файле кита)
  rules:
    build: true
    break-placed-only: true
  slots-menu:
    title: '<dark_gray>Свои киты'
    rows: 3
    slots:
      - 11
      - 12
      - 13
      - 14
      - 15
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    empty:
      material: LIME_STAINED_GLASS
      name: '<green>Слот {slot} <gray>· пусто'
      lore:
        - '<yellow>▶ Создать кит'
    filled:
      material: CHEST
      name: '<#c9a7ff>{name}'
      lore:
        - '<gray>Предметов: <white>{items}'
        - ''
        - '<yellow>▶ Изменить'
    delete:
      material: RED_DYE
      name: '<red>Удалить кит {slot}'
  builder:
    title: '<dark_gray>Свой кит {slot}'
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    armor-hint:
      material: ARMOR_STAND
      name: '<gray>← шлем, нагрудник, поножи, ботинки, левая рука'
      lore:
        - '<gray>Ряды 1–3 — инвентарь, ряд 4 — хотбар.'
        - '<gray>Предметы бери в «Каталоге» и раскладывай.'
    catalog:
      slot: 45
      material: ENDER_CHEST
      name: '<#c9a7ff><b>Каталог</b>'
      lore:
        - '<gray>Все предметы из всех китов.'
        - '<gray>Клик — копия к тебе в инвентарь.'
    clear:
      slot: 47
      material: BARRIER
      name: '<red>Очистить кит'
    save:
      slot: 49
      material: LIME_CONCRETE
      name: '<green><b>Сохранить</b>'
      lore:
        - '<gray>Сохранить кит и выйти'
    exit:
      slot: 53
      material: RED_CONCRETE
      name: '<gray>Выйти без сохранения'
  catalog:
    title: '<dark_gray>Каталог <gray>· {page}/{pages}'
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    prev:
      material: ARROW
      name: '<yellow>← Назад'
    next:
      material: ARROW
      name: '<yellow>Дальше →'
    back:
      material: CHEST
      name: '<green>← К киту'
  # нижний ряд меню дуэлей 1.8 / 1.9: свои киты, клик — очередь «Свой кит»
  duels-menu:
    enabled: true
    slots:
      - 38
      - 39
      - 40
      - 41
      - 42
    empty:
      material: GRAY_DYE
      name: '<gray>Свой кит {slot}'
      lore:
        - '<gray>Пусто'
        - '<yellow>▶ Создать: /kit create'
    ready:
      material: CHEST
      name: '<#c9a7ff>{name}'
      lore:
        - '<gray>Предметов: <white>{items}'
        - '<gray>В очереди «Свой кит» {version}: <white>{queue}'
        - ''
        - '<yellow>▶ Играть своим китом (PvP {version})'

# ═══ Кулдауны в играх ═══
# Кит может задать свой кулдаун жемчуга: rules.pearl-cooldown-ticks (0 — без кулдауна).
cooldowns:
  ender-pearl-ticks: 20             # 20 тиков = 1 секунда (как в ванили)
  enchanted-golden-apple-ticks: 600 # 30 секунд на чарованное яблоко
  golden-apple-ticks: 0             # обычные яблоки без кулдауна

# ═══ Митапы (шалкер в 8-м слоте лобби) ═══
# Арена: /arena mode <режим>. На каждого игрока N точки: p<N> (бой), pre<N> (коробка подготовки),
# loot<N>a и loot<N>b (шалкеры с лутом). Например для mup-14 — p1…p4, pre1…pre4, loot1a…loot4b.
meetups:
  display: '<#b48cff>Митап {mode}'
  prep-seconds: 60              # сколько стоят в коробках и собирают шалкеры
  default-version: "1.8"        # при равных голосах
  # team-size — игроков в команде (1 — каждый сам за себя), players — всего игроков
  modes:
    mup-12:
      display: '1x2'
      team-size: 1
      players: 2
    mup-14:
      display: '1x4'
      team-size: 1
      players: 4
    mup-18:
      display: '1x8'
      team-size: 1
      players: 8
    mup-116:
      display: '1x16'
      team-size: 1
      players: 16
    mup-22:
      display: '2x2'
      team-size: 2
      players: 4
    mup-24:
      display: '2x4'
      team-size: 2
      players: 8
    mup-28:
      display: '2x8'
      team-size: 2
      players: 16
  # лут шалкеров: у каждого полный сет брони и оружие (из предметов всех дуэльных китов), остальное случайно
  loot:
    shulker: PURPLE_SHULKER_BOX
    extra-items:
      min: 8
      max: 14
    exclude:                    # какие предметы не класть случайными
      - TOTEM_OF_UNDYING
      - END_CRYSTAL
      - RESPAWN_ANCHOR
  rules:
    build: true
    break-placed-only: false
    natural-regen: false
    max-duration-seconds: 900
  vote:
    slot: 8
    item:
      material: PAPER
      name: '<#b48cff><b>Голосование</b> <gray>(ПКМ)'
      lore:
        - '<gray>Выбери версию PvP: 1.8 или 1.9'
        - '<gray>Где больше голосов — то и будет'
    title: '<dark_gray>Версия PvP митапа'
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    legacy:
      slot: 11
      material: STONE_SWORD
      hide-attributes: true
      name: '<#ff9ecf><b>1.8</b> <gray>— быстрое {mine}'
      lore:
        - '<gray>Голосов: <white>{votes}'
    modern:
      slot: 15
      material: GOLDEN_SWORD
      hide-attributes: true
      name: '<gold><b>1.9</b> <gray>— медленное {mine}'
      lore:
        - '<gray>Голосов: <white>{votes}'

# BoxPvP (мини-игры → BoxPvP)
boxpvp:
  select-seconds: 30            # время выбора кита в мини-лобби
  kit-choices: 6                # если в boxpvp.yml нет classes — сколько случайных китов 1.9 предлагать
  hold-time: 3                  # сколько секунд удерживать все 9 блоков для победы
  respawn-seconds: 5            # кд возрождения (в это время — мини-лобби, можно сменить кит)
  wool: 64                      # шерсти своего цвета при каждом появлении
  selector:
    slot: 4
    material: CHEST
    name: '<#5fd6c4><b>Выбор класса</b> <gray>(ПКМ)'
    lore:
      - '<gray>Выбери класс: Мечник, Лучник, Танк, Поддержка, Хиллер, Ассасин'
  # выбор команды (только 2x4 / 3x4 / 4x4): в начале мини-лобби открывается меню команд, потом классов.
  # Кто не выбрал — попадает в команду, где меньше всего игроков.
  team-selector:
    slot: 3
    material: WHITE_WOOL
    name: '<#5fd6c4><b>Выбор команды</b> <gray>(ПКМ) · {team}'
    lore:
      - '<gray>Команду можно сменить, пока идёт выбор'
  team-menu:
    title: '<dark_gray>BoxPvP · выбор команды'
    slots:
      - 10
      - 12
      - 14
      - 16
  menu:
    title: '<dark_gray>BoxPvP · выбор класса'
    slots:
      - 10
      - 11
      - 12
      - 14
      - 15
      - 16
    filler:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
    default-icon:
      material: IRON_SWORD
      hide-attributes: true
      name: '{kit}'

# Быстрый старт во всех групповых режимах (мини-игры 1x3 / 1x4, BoxPvP, митапы):
# в очереди набралась половина участников (fraction) — пошёл таймер seconds, по истечении игра стартует с теми, кто есть.
# Набрались все — обычный старт сразу. Предмет «Быстрый старт» запускает раньше, если проголосовала vote-fraction ожидающих (минимум 2).
quick-start:
  enabled: true
  fraction: 0.5
  seconds: 30
  vote-fraction: 0.5
  slot: -1                      # -1 — первый свободный слот
  item:
    material: LIME_DYE
    name: '<green><b>Быстрый старт</b> <gray>(ПКМ)'
    lore:
      - '<gray>В очереди: <white>{waiting}/{players}'
      - '<gray>Голосов: <white>{votes}/{need}'
      - '<gray>Старт через: <white>{seconds} с'

# BowSpleef: через сколько тиков подожжённый стрелой TNT исчезает (падает вниз без взрыва)
bowspleef:
  fuse-ticks: 30
  blocks-min: 4                 # стрела поджигает 4–5 ближайших к точке попадания блоков TNT (случайно в этих пределах)
  blocks-max: 5
  search-radius: 2              # где искать эти блоки (в блоках от точки попадания)
  double-jump:                  # перо: дважды пробел в воздухе
    power: 0.75                 # вверх
    forward: 0.35               # вперёд по взгляду

# ═══ Свободные арены: Sword / SpearMace / ElytraMace (свои киты) и KnockbackFFA / BowFFA / SwordFFA (кит арены, 1.8) ═══
# Арена: /arena create … → режим sword | spearmace | elytramace, одна точка spawn.
# Игра не начинается и не кончается: заходят через NPC (/ffa npc <тип>) или /ffa <тип>.
# Sword / SpearMace / ElytraMace — только со своим китом (/kit create); смерть настоящая (вещи выпадают), после «Возродиться» — в лобби.
# Арены с секцией kit (KnockbackFFA, BowFFA, SwordFFA) — кит выдаёт сервер, умер — снова на арене (respawn).
# Умер — обратно в лобби (арена живёт дальше). Ломаются только блоки, поставленные игроками. Лимита игроков нет.
# Мир создаётся при первом входе и не удаляется и не чистится, пока сервер работает.
# Выйти — /lobby, но не в бою: после любого урона combat-seconds секунд выйти нельзя (боссбар сверху).
free-arenas:
  combat-seconds: 10
  spawn-protection: 2           # у точки spawn в этом радиусе ставить блоки нельзя (0 — можно)
  types:
    sword:
      display: '<#ff6b6b>Sword'
      npc-name: '<#ff6b6b><b>Sword</b> <gray>(ПКМ)'
      version: vanilla          # vanilla — обычное PvP 1.21.11 (плагин не трогает бой); можно "1.8" / "1.9"
      banned-items:             # нельзя в ките: материал или шаблон (*_SPEAR — все копья)
        - ELYTRA
        - WIND_CHARGE
        - MACE
        - '*_SPEAR'
      rules:
        build: true
        break-placed-only: true
        hunger: false
