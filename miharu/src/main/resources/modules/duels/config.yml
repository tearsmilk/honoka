# Рывок копьём: подкинуло зарядом ветра → в воздухе жмёшь (ПКМ/ЛКМ) копьём с «Рывком» → летишь вперёд, куда смотришь.
# Сила = base + per-level × уровень Рывка (Рывок III: 1.4 + 0.6×3 = 3.2). Один рывок на один подброс.
spear-dash:
  enabled: true
  base: 1.4
  per-level: 0.6
  lift: 0.15                    # чуть вверх, чтобы не врезаться в землю
  boost-radius: 3.5             # кого «подкинул» взрыв заряда (блоков)
  boost-seconds: 2.5            # сколько после взрыва можно сделать рывок
  cooldown-ticks: 20
