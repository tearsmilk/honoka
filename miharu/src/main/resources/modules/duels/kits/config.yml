# Сам кит (вещи и правила) — в файле <id>.yml рядом. Новый кит: создай <id>.yml и при желании добавь его сюда.
# Плейсхолдеры иконки: {kit} {version} {queue} (в очереди) {playing} (играют) {wins} {losses} {bot} (можно ли с ботом)
