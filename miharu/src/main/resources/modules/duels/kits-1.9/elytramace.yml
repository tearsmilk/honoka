  1: {material: NETHERITE_SWORD, enchants: {sharpness: 5}}
  2: {material: WIND_CHARGE, amount: 32}
  3: {material: FIREWORK_ROCKET, amount: 32}
  4: {material: GOLDEN_APPLE, amount: 16}
  5: {material: ENCHANTED_GOLDEN_APPLE, amount: 2}
  6: {material: POTION, potion: slow_falling}
  7: {material: POTION, potion: slow_falling}
  8: {material: COOKED_BEEF, amount: 32}
  9: {material: POTION, potion: slow_falling}
