  3: {material: END_CRYSTAL, amount: 64}
  4: {material: GOLDEN_APPLE, amount: 16}
  5: {material: POTION, potion: strong_strength}
  6: {material: POTION, potion: strong_strength}
  7: {material: TOTEM_OF_UNDYING}
  17: {material: TOTEM_OF_UNDYING}
