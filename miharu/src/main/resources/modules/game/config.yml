# Наблюдение за играми (предмет в лобби, /spectate [игрок])
spectate:
  menu:
    title: '<dark_gray>Активные игры'
    rows: 6
    game-icon:
      material: ENDER_EYE
      name: '<#ff9ecf>{mode}'
      lore:
        - '<gray>{players}'
        - '<gray>Арена: <white>{arena}'
        - '<gray>Время: <white>{time}</white> · зрителей: <white>{spectators}'
        - ''
        - '<yellow>▶ Смотреть'
    game-icons:
      bot-duel:
        material: ZOMBIE_HEAD
        name: '<#ff9ecf>{mode}'
        lore:
          - '<gray>{players} <gray>vs бот'
          - '<gray>Арена: <white>{arena}'
          - '<gray>Время: <white>{time}'
          - ''
          - '<yellow>▶ Смотреть'
      clicktest:
        material: SLIME_BALL
        name: '<#c9a7ff>{mode}'
        lore:
          - '<gray>{players}'
          - '<gray>Время: <white>{time}'
          - ''
          - '<yellow>▶ Смотреть'
    empty:
      slot: 22
      material: BARRIER
      name: '<gray>Сейчас никто не играет'
    refresh:
      slot: 49
      material: SUNFLOWER
      name: '<yellow>Обновить'
